packages:
  - name: fire_dashboard
    shared: false
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN}"
      SESSION_SECRET: "${SESSION_SECRET}"
      ENVIRONMENT: "${ENVIRONMENT}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      PASSWORD_RESET_FROM_EMAIL: "${PASSWORD_RESET_FROM_EMAIL}"
      PASSWORD_RESET_TOKEN_TTL_SECONDS: "${PASSWORD_RESET_TOKEN_TTL_SECONDS}"
      PASSWORD_RESET_EMAIL_SUBJECT: "${PASSWORD_RESET_EMAIL_SUBJECT}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_PLAN_ID: "${ADMIN_PLAN_ID}"
    functions:
      - name: auth_api
        runtime: python:3.13
        web: true
        annotations:
          web-custom-options: true
